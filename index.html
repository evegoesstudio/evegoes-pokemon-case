<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon card custom case</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#c3deff;--ink:#050506;--pink:#aabee5;--pinkd:#aabee5;--line:#e7f2ff;--muted:#292929}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;line-height:1.5}
header,main{max-width:980px;margin:0 auto;padding:0 20px}
header{padding-top:40px}
h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(1.7rem,5vw,2.7rem);line-height:1.05;margin:0}
.sub{max-width:54ch;color:var(--muted);margin:10px 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding-bottom:48px}

.card{position:relative;border:0;border-radius:14px;padding:8px;text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .15s}
.card-default { background: #fff; } 
.card-nhom-1 { background: #ffe6ef; } 
.card-nhom-2 { background: #fff6d1; }
.card-nhom-3 { background: #fdfdf5; }
.card-nhom-4 { background: #dedfda; }

.card:not(:disabled):hover{transform:translateY(-3px)}
.card:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pinkd);outline-offset:2px}
.pic{aspect-ratio:63/88;border-radius:8px;overflow:hidden;background:var(--line)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 4px 2px}
.name{font-weight:700;font-size:.9rem}
.price{font-family:'Baloo 2',sans-serif;font-weight:800;color:var(--pinkd);white-space:nowrap}
.tag{display:none;position:absolute;top:36%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);background:var(--ink);color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.25rem;padding:0 16px;border-radius:8px}
.card:disabled{cursor:default}
.card:disabled img{filter:grayscale(1);opacity:.4}
.card:disabled .tag{display:block}
.card:disabled .price{color:var(--muted)}
.status{padding:40px 0;color:var(--muted)}
h2{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.3rem;margin:8px 0 12px}
section{margin-bottom:12px}

/* Sửa CSS cho Dialog để đặt nút Hủy góc phải */
dialog{position:relative;border:0;border-radius:18px;padding:22px;width:min(460px,calc(100% - 32px));max-height:90vh;overflow:auto;color:var(--ink);background:#fff}
dialog::backdrop{background:rgba(58,42,77,.55)}

/* CSS nút Hủy góc phải */
.close-btn {position:absolute;top:16px;right:16px;background:var(--line);border:none;border-radius:8px;padding:6px 14px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;font-size:.9rem;transition:background 0.15s;}
.close-btn:hover {background:var(--pink);color:var(--ink)}

.sel{display:flex;gap:12px;align-items:center;margin-bottom:16px;padding-right:60px;}
.sel img{width:56px;aspect-ratio:63/88;object-fit:cover;border-radius:6px}
.sel b{display:block}
label{display:block;font-weight:700;margin:12px 0 4px}
input,textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px;margin-top:18px}
button.btn{flex:1;font:inherit;font-weight:700;padding:11px 14px;border-radius:10px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
button.btn.main,a.btn.main{background:var(--ink);color:#fff}
button.btn:hover,a.btn:hover{background:var(--pink);border-color:var(--pink);color:var(--ink)}
a.btn{flex:1;text-align:center;text-decoration:none;font-weight:700;padding:11px 14px;border-radius:10px;border:2px solid var(--ink)}
.err{color:var(--pinkd);font-weight:700;min-height:1.4em;margin:10px 0 0}
.code{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.8rem;margin:4px 0}
.grp{border:0;margin:18px 0 0;padding:14px 0 0;border-top:2px dashed var(--line)}
.grp legend{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.05rem;padding:0 8px 0 0}
.notes{background:var(--bg);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:.92rem}
.notes summary{cursor:pointer;font-weight:700}
.notes p{margin:8px 0 0;white-space:pre-line}
.seg{display:flex;gap:10px}
.seg label{flex:1;display:flex;gap:8px;align-items:center;margin:0;padding:10px 12px;border:2px solid var(--line);border-radius:10px;cursor:pointer}
.seg input{width:auto}
.seg label:has(input:checked){border-color:var(--ink);background:var(--bg)}
.sticks img{width:100%;border-radius:10px;display:block;margin-bottom:6px}
.est{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:14px;font-weight:700}
.est small{display:block;font-weight:400;color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
